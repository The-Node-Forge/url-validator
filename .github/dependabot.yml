version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docusaurus: # these packages must be upgraded in lockstep
        patterns:
          - '@docusaurus/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
