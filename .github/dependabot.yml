version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      typedoc: # typedoc plugins pin a typedoc minor
        patterns:
          - 'typedoc*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docusaurus: # these packages must be upgraded in lockstep
        patterns:
          - '@docusaurus/*'
      typedoc:
        patterns:
          - 'typedoc*'
          - 'docusaurus-plugin-typedoc'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
