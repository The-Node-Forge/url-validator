name: Deploy Docusaurus Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual deployment

permissions:
  contents: write # pushes the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Docusaurus Dependencies
        run: |
          cd docs
          npm ci

      - name: Generate API Docs
        run: npm run docs:generate

      - name: Build Docusaurus
        run: npm run docs:build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy Docusaurus docs"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
