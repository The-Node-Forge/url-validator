name: Continuous Integration (CI)

permissions:
  contents: write # only used by the auto-format commit step below

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier and auto-fix
        run: npx prettier --write .

      - name: Run ESLint and auto-fix
        run: npx eslint . --fix

      - name: Ensure test files exist
        run: |
          if ! find ./tests ./src -type f \( -name "*.test.ts" -o -name "*.test.js" \) | grep .; then
            echo "::error::No test files found! PRs require tests."
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Smoke test built package
        run: |
          node -e "const m = require('./dist'); if (typeof m.validateUrl !== 'function' || typeof m.isUrlLive !== 'function') process.exit(1)"
          node --input-type=module -e "import('./dist/index.js').then((m) => { if (typeof m.validateUrl !== 'function' || typeof m.isUrlLive !== 'function') process.exit(1) })"

      - name: Install Docusaurus Dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run docs:build

      - name: Run Jest tests
        run: npm test -- --coverage

      - name: Upload Jest test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-results
          path: coverage

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-format & lint fixes"

          if [[ $GITHUB_REF != refs/pull/* ]]; then
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          else
            echo "Skipping push: Cannot push changes to a PR merge ref."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
