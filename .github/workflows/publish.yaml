name: Publish to npm

# Publishes when a version tag is pushed, e.g. `git tag v1.2.0 && git push origin v1.2.0`.
# Uses npm trusted publishing (OIDC), so no npm token is stored in this repo.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions,
# organization `The-Node-Forge`, repository `url-validator`, workflow `publish.yaml`.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches package.json and is on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test and build
        run: |
          npm test
          npm run build
          node -e "const m = require('./dist'); if (typeof m.validateUrl !== 'function' || typeof m.isUrlLive !== 'function') process.exit(1)"

      - name: Publish
        run: |
          tag_args=""
          case "$GITHUB_REF_NAME" in *-*) tag_args="--tag next" ;; esac # prereleases don't become `latest`
          npm publish --provenance --access public $tag_args

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="### v$version" 'index($0, v) == 1 {f=1; next} f && (/^### / || /^<!--/) {exit} f' \
            docs/docs/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/docs/CHANGELOG.md)." > release-notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
